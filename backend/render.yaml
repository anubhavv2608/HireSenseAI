services:
  - type: web
    name: hiresenseai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: AI_TIMEOUT_MS
        value: 30000
      - key: AI_MAX_RETRIES
        value: 2
      - key: AI_TEMPERATURE
        value: 0.2
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: HireSenseAI <onboarding@resend.dev>
      # Secrets and environment-specific values — set these in the Render dashboard,
      # never in this file.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
